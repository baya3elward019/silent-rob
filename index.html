<!doctype html>
<html lang="ar" dir="rtl">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<body>
<title>Silent Rob</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one full-viewport 3D stage; every piece of UI is a thin overlay on its edges. Single dark night look by choice. */
:root{
  --bg:#070a14; --panel:rgba(12,15,30,.84); --panel-solid:#0e1226; --line:#2c3460; --ink:#eceeff; --muted:#9aa2cc;
  --amber:#ffc35a; --violet:#8f7bff; --cyan:#63e6ff; --red:#ff4d5e; --ok:#5ff0b0;
  --latin:'Chakra Petch','Segoe UI',Tahoma,sans-serif;
  --display:'Reem Kufi','Chakra Petch','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow:hidden}
#app{position:relative;width:100%;height:100%;min-height:340px;overflow:hidden;background:var(--bg);user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#edge,#vig,#flash,#fade{position:absolute;inset:0;pointer-events:none}
#edge{box-shadow:inset 0 0 90px 24px var(--red);opacity:0;transition:opacity .25s}
#vig{background:radial-gradient(ellipse at center,transparent 45%,rgba(120,0,16,.75) 100%);opacity:0;transition:opacity .4s}
#flash{background:var(--ink);opacity:0}
#flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
#fade{background:var(--bg);opacity:0;transition:opacity .35s}
#fade.on{opacity:1}

/* HUD */
#hud::before{content:'';position:absolute;inset:0 0 auto 0;height:96px;background:linear-gradient(rgba(7,10,20,.88),transparent);pointer-events:none}
#hud>*{position:absolute}
.h-hp{top:12px;left:16px;display:flex;gap:6px;direction:ltr}
.h-hp i{width:26px;height:10px;background:var(--red);transform:skewX(-18deg);box-shadow:0 0 10px rgba(255,77,94,.6);transition:background .3s,box-shadow .3s}
.h-hp i.off{background:#2a2f4c;box-shadow:none}
.h-shade{top:30px;left:16px;font-size:12px;color:var(--muted);direction:rtl}
.h-shade b{color:var(--violet);font-weight:600}
.h-obj{top:10px;left:50%;transform:translateX(-50%);text-align:center;max-width:46%;pointer-events:none}
#hObj{font-family:var(--display);font-size:clamp(14px,2.4vw,19px);font-weight:500;text-shadow:0 2px 8px #000}
.h-sub{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
.h-sub .pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6);color:var(--amber)}100%{transform:scale(1)}}
.h-al{top:10px;right:60px;width:min(190px,34vw);text-align:right}
.pips{display:flex;gap:4px;direction:ltr}
.pips i{flex:1;height:6px;background:#2a2f4c;transition:background .3s}
.pips[data-l="1"] i:nth-child(-n+2){background:var(--amber)}
.pips[data-l="2"] i:nth-child(-n+3){background:#ff8b3d}
.pips[data-l="3"] i{background:var(--red);animation:blink .5s infinite}
.pips[data-l="0"] i:first-child{background:var(--ok)}
@keyframes blink{50%{opacity:.35}}
#hAl{font-family:var(--display);font-size:14px;margin-top:2px;text-shadow:0 1px 6px #000}
.h-al .bar{height:4px;background:#1b2040;margin-top:3px;direction:ltr}
.h-al .bar b{display:block;height:100%;width:0;background:var(--amber)}
.noise{display:flex;gap:3px;align-items:flex-end;height:14px;margin-top:5px;direction:ltr;justify-content:flex-end}
.noise i{width:4px;background:#2a2f4c;height:30%}
.noise i:nth-child(2){height:45%}.noise i:nth-child(3){height:60%}.noise i:nth-child(4){height:80%}.noise i:nth-child(5){height:100%}
.noise i.on{background:var(--cyan)}
#bPause{top:10px;right:12px;width:38px;height:38px;padding:0;font-family:var(--latin);font-weight:700}

button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:9px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
button:hover:not(:disabled){border-color:var(--amber)}
button:active:not(:disabled){transform:scale(.97)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--amber);color:#1a1202;border-color:var(--amber);font-weight:600}
button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(99,230,255,.12)}

#prompt{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--amber);padding:6px 14px;font-weight:600;white-space:nowrap;pointer-events:none}
#prompt kbd,.gad kbd,.act kbd{font-family:var(--latin);font-size:11px;border:1px solid var(--line);padding:0 5px;color:var(--muted);margin-inline-start:6px}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);color:var(--amber);font-weight:600;text-align:center;text-shadow:0 2px 8px #000;pointer-events:none;max-width:86%}

#pad{position:absolute;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none;direction:ltr}
#pad button{pointer-events:auto}
.gad{display:flex;gap:6px;margin-inline:auto;direction:rtl;flex-wrap:wrap;justify-content:center}
.gad button{display:flex;flex-direction:column;align-items:center;gap:0;min-width:74px;padding:6px 8px;line-height:1.3;font-size:13px}
.gad .n{font-family:var(--latin);font-weight:700;color:var(--amber);font-size:16px}
.gad button.live{border-color:var(--cyan)}
.gad button.live .n{color:var(--cyan)}
.act{display:grid;grid-template-columns:repeat(2,64px);gap:8px;direction:rtl}
.act button{height:64px;border-radius:50%;padding:0;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.act #bFire{border-color:var(--red);color:var(--ink);background:rgba(255,77,94,.2)}
.act #bAct.ready{border-color:var(--amber);background:rgba(255,195,90,.22)}
@media (hover:hover) and (pointer:fine){.act{grid-template-columns:repeat(4,58px)}.act button{height:44px;border-radius:0}}
@media (max-width:640px){
  .gad button{min-width:58px;font-size:11.5px;padding:4px 6px}.gad kbd{display:none}
  .h-al{right:56px;width:38vw}#hObj{font-size:14px}.h-obj{top:68px;max-width:94%;width:94%}#toast{top:122px}#hud::before{height:130px}
  #pad{flex-direction:column;align-items:flex-end}.gad{margin:0 auto}
  #prompt{bottom:200px}
}
#joy{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:2px solid rgba(236,238,255,.45);border-radius:50%;pointer-events:none}
#joy i{position:absolute;left:28px;top:28px;width:28px;height:28px;border-radius:50%;background:rgba(236,238,255,.6)}

/* cinematic intro */
#intro{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#intro .lb{height:11%;background:#000;animation:lb .5s ease-out}
@keyframes lb{from{height:0}}
#intro .ttl{text-align:center;padding:0 16px;animation:rise .7s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#intro small{font-family:var(--latin);letter-spacing:.3em;color:var(--amber);font-size:13px}
#intro h2{font-family:var(--display);font-size:clamp(30px,7vw,60px);margin:0;line-height:1.15;text-shadow:0 4px 24px #000}
#intro p{margin:4px auto 0;color:var(--ink);max-width:48ch;text-shadow:0 2px 8px #000}

/* screens */
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));background:linear-gradient(90deg,rgba(7,10,20,.25),rgba(7,10,20,.9));overflow:auto}
#screen:not(.dim){justify-content:flex-start;padding-inline-start:6vw}
#screen.dim{background:rgba(7,10,20,.86)}
.card{width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:rise .35s ease-out}
.card.wide{width:min(900px,100%)}
.logo{font-family:var(--latin);font-weight:700;font-size:clamp(44px,10vw,92px);line-height:.95;letter-spacing:.04em;margin:0;direction:ltr;text-align:right;text-shadow:0 0 34px rgba(143,123,255,.55)}
.logo span{color:var(--amber)}
.tag{color:var(--muted);margin:0}
.menu{display:flex;flex-direction:column;gap:8px;width:min(300px,100%);margin-inline-start:auto}
.menu button{text-align:start;font-family:var(--display);font-size:18px;padding:10px 18px}
h2.h{font-family:var(--display);font-size:clamp(22px,4.5vw,32px);margin:0;line-height:1.2}
h2.en{font-family:var(--latin);letter-spacing:.14em;direction:ltr;text-align:center}
.money{font-family:var(--latin);color:var(--amber);font-weight:700}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.levels button{text-align:start;display:flex;flex-direction:column;gap:1px;padding:9px 11px}
.levels .nm{font-family:var(--display);font-size:16.5px}
.levels .ds{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.levels .st,.stars{color:var(--amber);letter-spacing:2px}
.stars{font-size:38px;text-align:center;line-height:1;letter-spacing:8px}
.stars i{font-style:normal;display:inline-block;animation:star .5s backwards}
.stars i:nth-child(2){animation-delay:.25s}.stars i:nth-child(3){animation-delay:.5s}
@keyframes star{from{transform:scale(3) rotate(40deg);opacity:0}}
.rows{display:grid;grid-template-columns:1fr auto;gap:4px 16px;background:var(--panel);border:1px solid var(--line);padding:12px 14px}
.rows b{font-family:var(--latin);font-variant-numeric:tabular-nums;text-align:end}
.rows .ok{color:var(--ok)}.rows .bad{color:var(--red)}.rows .tot{color:var(--amber);font-size:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.shop{display:flex;flex-direction:column;gap:8px}
.shop .it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.shop small{color:var(--muted);grid-column:1}
.shop .lv{font-family:var(--latin);color:var(--cyan);letter-spacing:3px}
.shop button{grid-row:1/3;grid-column:2}
.how{background:var(--panel);border:1px solid var(--line);padding:12px 16px;margin:0;display:grid;gap:6px}
.how b{color:var(--amber)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

<div id="app" dir="rtl" lang="ar">
  <canvas id="cv" aria-label="ساحة اللعب"></canvas>
  <div id="edge"></div><div id="vig"></div><div id="flash"></div>
  <div id="hud" hidden>
    <div class="h-hp" id="hHp" aria-label="الصحة"><i></i><i></i><i></i></div>
    <div class="h-shade" id="hShade"></div>
    <div class="h-obj"><div id="hObj"></div><div class="h-sub"><span id="hTime">00:00</span><span id="hGems">◆ 0/3</span><span id="hKey"></span><span id="hScore">0</span></div></div>
    <div class="h-al"><div class="pips" id="hPips" data-l="0"><i></i><i></i><i></i><i></i></div><div id="hAl">آمن</div><div class="bar"><b id="hDet"></b></div><div class="noise" id="hNoise" aria-label="مستوى الصوت"><i></i><i></i><i></i><i></i><i></i></div></div>
    <button id="bPause" type="button" aria-label="إيقاف مؤقت">II</button>
  </div>
  <div id="prompt" hidden></div>
  <div id="toast"></div>
  <div id="pad" hidden>
    <div class="gad">
      <button id="bSmoke" type="button" data-tool="smoke"><span class="n" id="nSmoke">0</span><span>دخان<kbd>1</kbd></span></button>
      <button id="bEmp" type="button" data-tool="emp"><span class="n" id="nEmp">0</span><span>تعطيل<kbd>2</kbd></span></button>
      <button id="bCoin" type="button" data-tool="coin"><span class="n" id="nCoin">0</span><span>عملة<kbd>3</kbd></span></button>
    </div>
    <div class="act">
      <button id="bFire" type="button"><span class="n" id="nDart">0</span><span>طلقة</span></button>
      <button id="bAct" type="button"><span id="actLbl">تفاعل</span></button>
      <button id="bCrouch" type="button" aria-pressed="false">تسلل</button>
      <button id="bRun" type="button" aria-pressed="false">جري</button>
    </div>
  </div>
  <div id="joy" hidden><i id="knob"></i></div>
  <div id="intro" hidden><div class="lb"></div><div class="ttl"><small id="inNum"></small><h2 id="inName"></h2><p id="inBrief"></p></div><div class="lb"></div></div>
  <div id="screen"></div>
  <div id="fade"></div>
</div>

const GEN_NAMES=["المستودع","الميناء","السفارة","المتحف","برج الاتصالات","المصنع","الكازينو","القطار المصفّح","مركز البيانات","القلعة","المنجم","المطار","السفينة","البرج الزجاجي","المقر الرئيسي"];
const GEN_THEME=['warehouse','warehouse','palace','gallery','lab','warehouse','palace','vault','lab','palace','warehouse','bank','vault','bank','vault'];

function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function laserTiles(l){const o=[],tr=l.travel||0,hz=l.dir==='h';for(let n=0;n<l.len;n++)for(let m=0;m<=tr;m++)o.push(hz?[l.x+n,l.y+m]:[l.x+m,l.y+n]);return o}
function findCh(map,c){for(let y=0;y<map.length;y++){const x=map[y].indexOf(c);if(x>=0)return[x,y]}return null}

/* a level is valid when: exit/key reachable, the loot needs the key if there is one, no sealed rooms */
function validate(L){
  const g=L.map,H=g.length,W=g[0].length,P=findCh(g,'P'),T=findCh(g,'T'),E=findCh(g,'E'),Ky=findCh(g,'K');
  if(!P||!T||!E)return false;
  const fl=(x,y,d)=>y>=0&&y<H&&x>=0&&x<W&&g[y][x]!=='#'&&(d||g[y][x]!=='D');
  const flood=d=>{const s=new Uint8Array(W*H),q=[P];s[P[0]+P[1]*W]=1;for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,b]of D4){const nx=x+a,ny=y+b;if(fl(nx,ny,d)&&!s[nx+ny*W]){s[nx+ny*W]=1;q.push([nx,ny])}}}return s};
  const A=flood(false),B=flood(true),inA=p=>p&&A[p[0]+p[1]*W]===1,inB=p=>p&&B[p[0]+p[1]*W]===1;
  if(!inA(E))return false;
  if(Ky){if(!inA(Ky)||inA(T)||!inB(T))return false}else if(!inA(T))return false;
  let nf=0,nb=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(g[y][x]!=='#')nf++;nb+=B[x+y*W]}
  if(nf!==nb)return false;
  if(!L.gems.every(inB)||!(L.fakes||[]).every(inA))return false;
  if(!L.guards.every(gd=>gd.wp.length>1&&gd.wp.every(inA)))return false;
  if(!L.cams.every(c=>inB([c.x,c.y])))return false;
  if(!L.lasers.every(l=>laserTiles(l).every(inB)))return false;
  if(!(L.shutters||[]).every(l=>laserTiles(l).every(inA)))return false;
  return true;
}

/* furniture, lockers, light switches and ceiling lamps — placed so that no route is ever blocked */
function decorate(L,seed){
  const R=rng(seed),ri=n=>Math.floor(R()*n),g=L.map,H=g.length,W=g[0].length,th=THEMES[L.theme];
  const occ=new Uint8Array(W*H),res=new Uint8Array(W*H);
  const fl=(x,y)=>y>=0&&y<H&&x>=0&&x<W&&g[y][x]!=='#';
  const rsv=(x,y,r)=>{for(let b=-r;b<=r;b++)for(let a=-r;a<=r;a++)if(fl(x+a,y+b))res[x+a+(y+b)*W]=1};
  const P=findCh(g,'P');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=g[y][x];if(c==='#')continue;
    if('PTEKD'.includes(c))rsv(x,y,1);
    if((!fl(x-1,y)&&!fl(x+1,y))||(!fl(x,y-1)&&!fl(x,y+1)))rsv(x,y,1)}
  for(const p of L.gems.concat(L.fakes||[]))rsv(p[0],p[1],0);
  for(const gd of L.guards)for(const p of gd.wp)rsv(p[0],p[1],0);
  for(const c of L.cams)rsv(c.x,c.y,0);
  // keep every patrol route clear, so furniture never re-routes a guard through another room
  const route=(a,b)=>{const prev=new Int32Array(W*H).fill(-1),qq=[a[0]+a[1]*W],goal=b[0]+b[1]*W;prev[qq[0]]=qq[0];
    for(let h=0;h<qq.length;h++){const c=qq[h];if(c===goal)break;const x=c%W,y=(c/W)|0;for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy,n=nx+ny*W;if(fl(nx,ny)&&g[ny][nx]!=='D'&&prev[n]<0){prev[n]=c;qq.push(n)}}}
    let c=goal;if(prev[c]<0)return;while(c!==prev[c]){res[c]=1;c=prev[c]}};
  for(const gd of L.guards)for(let i=0;i<gd.wp.length;i++){route(gd.wp[i],gd.wp[(i+1)%gd.wp.length]);route(gd.wp[(i+1)%gd.wp.length],gd.wp[i])}
  for(const l of L.lasers.concat(L.shutters||[]))for(const p of laserTiles(l))rsv(p[0],p[1],1);
  const seen=new Uint8Array(W*H),q=new Int32Array(W*H);
  const flood=()=>{seen.fill(0);let h=0,t=0;q[t++]=P[0]+P[1]*W;seen[q[0]]=1;
    while(h<t){const c=q[h++],x=c%W,y=(c/W)|0;for(const[a,b]of D4){const nx=x+a,ny=y+b,n=nx+ny*W;if(fl(nx,ny)&&!occ[n]&&!seen[n]){seen[n]=1;q[t++]=n}}}return t};
  const n0=flood(),cells=[];for(let i=0;i<W*H;i++)if(seen[i])cells.push(i);
  const props=[];let no=0;
  const place=(i,kind)=>{if(res[i]||occ[i])return false;occ[i]=1;if(flood()!==n0-no-1){occ[i]=0;return false}no++;props.push({x:i%W,y:(i/W)|0,kind,tall:PROP_TALL[kind],rot:ri(4)});return true};
  const nearWall=i=>{const x=i%W,y=(i/W)|0;return D4.some(([a,b])=>!fl(x+a,y+b))};
  const want=Math.floor(n0/13);let tries=0;
  while(props.length<want&&tries++<want*14){const i=cells[ri(cells.length)],side=nearWall(i);if(!side&&R()<.5)continue;const list=side?th.side:th.mid;place(i,list[ri(list.length)])}
  let nl=0;tries=0;const wantL=1+Math.floor(n0/170);
  while(nl<wantL&&tries++<400){const i=cells[ri(cells.length)];if(nearWall(i)&&place(i,'locker'))nl++}
  const switches=[];tries=0;const wantS=1+(n0>340?1:0);
  while(switches.length<wantS&&tries++<400){const i=cells[ri(cells.length)],x=i%W,y=(i/W)|0;if(occ[i]||res[i])continue;
    const d=D4.find(([a,b])=>!fl(x+a,y+b));if(d&&!switches.some(s=>Math.abs(s.x-x)+Math.abs(s.y-y)<6))switches.push({x,y,dx:d[0],dy:d[1]})}
  const lamps=[],T=findCh(g,'T');flood();
  for(let by=1;by<H-1;by+=5)for(let bx=1;bx<W-1;bx+=5){let best=-1,bd=99;
    for(let y=by;y<Math.min(H-1,by+5);y++)for(let x=bx;x<Math.min(W-1,bx+5);x++){const i=x+y*W;if(!seen[i])continue;const d=Math.abs(x-bx-2)+Math.abs(y-by-2);if(d<bd){bd=d;best=i}}
    if(best>=0){const x=best%W,y=(best/W)|0,nearT=Math.abs(x-T[0])+Math.abs(y-T[1])<4;lamps.push({x,y,on:nearT||R()>.27,flick:R()<.18})}}
  L.props=props;L.switches=switches;L.lamps=lamps;return L;
}

/* procedural building: recursive room splitting with real corridors, extra loop doors, a locked vault,
   then guards / cameras / lasers scaled with the level number. Retries until validate() passes. */
function tryGen(k,seed){
  const R=rng(seed),ri=n=>Math.floor(R()*n),pick=a=>a[ri(a.length)];
  const W=27+Math.min(16,Math.round(k*1.2)),H=17+Math.min(12,Math.round(k*.85));
  const g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++)g[y].push(x===0||y===0||x===W-1||y===H-1?'#':'.')}
  const leaves=[],doors=[];
  const split=(x0,y0,x1,y1,d)=>{
    const w=x1-x0+1,h=y1-y0+1,cv=w>=13,ch=h>=11;
    if((!cv&&!ch)||d>5||(d>=2&&w*h<95&&R()<.35)){leaves.push({x0,y0,x1,y1});return}
    const vert=cv&&(!ch||(w>h*1.15?R()<.85:R()<.3));
    if(vert){const cor=w>=18&&R()<.5,sx=x0+6+ri(w-12-(cor?3:0));
      for(let y=y0;y<=y1;y++){g[y][sx]='#';if(cor)g[y][sx+3]='#'}
      const mk=x=>{const y=y0+ri(h-1);g[y][x]=g[y+1][x]='.';doors.push({x,y,len:2,dir:'v'})};
      mk(sx);if(cor){mk(sx+3);leaves.push({x0:sx+1,y0,x1:sx+2,y1,cor:'v'})}
      split(x0,y0,sx-1,y1,d+1);split(sx+(cor?4:1),y0,x1,y1,d+1);
    }else{const cor=h>=16&&R()<.5,sy=y0+5+ri(h-10-(cor?3:0));
      for(let x=x0;x<=x1;x++){g[sy][x]='#';if(cor)g[sy+3][x]='#'}
      const mk=y=>{const x=x0+ri(w-1);g[y][x]=g[y][x+1]='.';doors.push({x,y,len:2,dir:'h'})};
      mk(sy);if(cor){mk(sy+3);leaves.push({x0,y0:sy+1,x1,y1:sy+2,cor:'h'})}
      split(x0,y0,x1,sy-1,d+1);split(x0,sy+(cor?4:1),x1,y1,d+1);
    }
  };
  split(1,1,W-2,H-2,0);
  // extra doors make loops = alternative routes
  let extra=2+ri(3),tr=0;
  while(extra>0&&tr++<200){const x=2+ri(W-5),y=2+ri(H-5);
    if(g[y][x]==='#'&&g[y][x+1]==='#'&&g[y-1][x]==='.'&&g[y-1][x+1]==='.'&&g[y+1][x]==='.'&&g[y+1][x+1]==='.'&&g[y][x-1]==='#'&&g[y][x+2]==='#'){g[y][x]=g[y][x+1]='.';doors.push({x,y,len:2,dir:'h'});extra--}
    else if(g[y][x]==='#'&&g[y+1][x]==='#'&&g[y][x-1]==='.'&&g[y+1][x-1]==='.'&&g[y][x+1]==='.'&&g[y+1][x+1]==='.'&&g[y-1][x]==='#'&&g[y+2][x]==='#'){g[y][x]=g[y+1][x]='.';doors.push({x,y,len:2,dir:'v'});extra--}}
  const start=leaves.find(l=>l.x0===1&&l.y0===1);if(!start||start.cor)return null;
  const rooms=leaves.filter(l=>!l.cor&&l!==start),cors=leaves.filter(l=>l.cor);
  if(rooms.length<3)return null;
  // BFS distance from the entrance
  const dist=new Int32Array(W*H).fill(-1),q=[[1,1]];dist[1+W]=0;
  for(let i=0;i<q.length;i++){const[x,y]=q[i];for(const[a,b]of D4){const nx=x+a,ny=y+b;if(g[ny][nx]!=='#'&&dist[nx+ny*W]<0){dist[nx+ny*W]=dist[x+y*W]+1;q.push([nx,ny])}}}
  const cen=l=>[(l.x0+l.x1)>>1,(l.y0+l.y1)>>1],dl=l=>{const c=cen(l);return dist[c[0]+c[1]*W]};
  const big=rooms.filter(l=>l.x1-l.x0>=7&&l.y1-l.y0>=6);
  const wantVault=k>=3&&big.length>0;
  const loot=(wantVault?big:rooms).slice().sort((a,b)=>dl(b)-dl(a))[0];
  g[1][1]='P';g[start.y1][1]='E';
  let T,Kpos=null;
  if(wantVault){const sx=R()<.5?1:-1,sy=R()<.5?1:-1,cx=sx>0?loot.x1:loot.x0,cy=sy>0?loot.y1:loot.y0;
    for(let j=0;j<=3;j++){g[cy-sy*j][cx-sx*3]='#';g[cy-sy*3][cx-sx*j]='#'}
    g[cy-sy][cx-sx*3]='D';T=[cx-sx,cy-sy];
  }else T=cen(loot);
  if(g[T[1]][T[0]]!=='.')return null;g[T[1]][T[0]]='T';
  const cell=l=>{for(let i=0;i<40;i++){const x=l.x0+ri(l.x1-l.x0+1),y=l.y0+ri(l.y1-l.y0+1);if(g[y][x]==='.'&&dist[x+y*W]>=0)return[x,y]}return null};
  const others=rooms.filter(l=>l!==loot);
  if(wantVault){const mid=others.slice().sort((a,b)=>dl(a)-dl(b))[Math.floor(others.length*.6)]||loot;Kpos=cell(mid);if(!Kpos)return null;g[Kpos[1]][Kpos[0]]='K'}
  const gems=[],fakes=[];
  for(let i=0;i<3;i++){const c=cell(others.length?others[(i*2+ri(others.length))%others.length]:loot);if(!c)return null;g[c[1]][c[0]]='g';gems.push(c)}
  if(k>=9)for(let i=0;i<(k>=12?2:1);i++){const c=cell(pick(rooms));if(!c)return null;g[c[1]][c[0]]='g';fakes.push(c)}
  const pool=k<2?['normal']:k<5?['normal','normal','fast','security']:k<9?['normal','fast','security','heavy']:['fast','security','heavy','elite','elite'];
  const ng=Math.min(8,2+Math.floor(k*.45)),guards=[],all=rooms.concat(cors);
  for(let i=0;i<ng;i++){const A=all[(i*3+ri(all.length))%all.length],ca=cen(A);
    const near=all.filter(l=>l!==A&&Math.abs(cen(l)[0]-ca[0])+Math.abs(cen(l)[1]-ca[1])<17);
    const wp=[cell(A),cell(near.length?pick(near):A),cell(A),cell(near.length?pick(near):A)];
    if(wp.some(p=>!p))return null;guards.push({type:pick(pool),wp})}
  const nc=1+Math.floor(k/3),cams=[];
  for(let i=0;i<nc;i++){const l=pick(all),cx=R()<.5?l.x0:l.x1,cy=R()<.5?l.y0:l.y1,c=cen(l);
    if(g[cy][cx]==='#')continue;cams.push({x:cx,y:cy,a:Math.atan2(c[1]-cy,c[0]-cx)*180/Math.PI,sweep:35,range:6})}
  const cand=doors.filter(d=>!(d.x<=start.x1+1&&d.y<=start.y1+1)&&laserTiles(d).every(p=>g[p[1]][p[0]]==='.'));
  const nl=Math.min(cand.length,1+Math.floor(k/2)),lasers=[];
  for(let i=0;i<nl;i++){const d=cand.splice(ri(cand.length),1)[0];lasers.push({x:d.x,y:d.y,len:2,dir:d.dir,on:1.8+R(),off:1.6,ph:R()*3,kind:k>=5&&R()<.35?'cross':'beam'})}
  const nm=Math.min(cors.length,Math.floor((k+1)/4));
  for(let i=0;i<nm;i++){const c=cors[i];
    if(c.cor==='v'&&c.y1-c.y0>=6)lasers.push({x:c.x0,y:c.y0+1,len:2,dir:'h',kind:'move',travel:c.y1-c.y0-2,speed:1.5,on:1,off:0,ph:0});
    else if(c.cor==='h'&&c.x1-c.x0>=6)lasers.push({x:c.x0+1,y:c.y0,len:2,dir:'v',kind:'move',travel:c.x1-c.x0-2,speed:1.5,on:1,off:0,ph:0})}
  const shutters=[];if(k>=6)for(let i=0;i<2&&cand.length;i++){const d=cand.splice(ri(cand.length),1)[0];shutters.push({x:d.x,y:d.y,len:2,dir:d.dir})}
  for(const c of gems.concat(fakes))g[c[1]][c[0]]='.';
  const nmv=lasers.filter(l=>l.kind==='move').length;
  const bits=[ng+' حراس',cams.length+' كاميرات',lasers.length+' ليزر'];
  if(wantVault)bits.push('خزنة بمفتاح');if(nmv)bits.push('ليزر متحرك');if(fakes.length)bits.push('جواهر مزيفة');if(shutters.length)bits.push('بوابات طوارئ');
  const L={name:GEN_NAMES[k],theme:GEN_THEME[k],par:70+Math.round(W*H/9),brief:bits.join(' · ')+'. المخرج عند نقطة البداية.',
    map:g.map(r=>r.join('')),guards,cams,lasers,gems,fakes,shutters,tools:{smoke:2+(k>6?1:0),emp:2,coin:3,dart:4+Math.floor(k/3)}};
  return validate(L)?L:null;
}
function gen(k){let fb=null;for(let a=0;a<80;a++){const L=tryGen(k,k*7919+101+a*977);if(!L)continue;if(k<3||a>50||findCh(L.map,'K'))return L;fb=fb||L}return fb}
for(let k=0;k<15;k++){const L=gen(k);if(L)LEVELS.push(L)}
LEVELS.forEach((L,i)=>{L.fakes=L.fakes||[];L.shutters=L.shutters||[];decorate(L,i*131+7)});

/* ---------- vision cone with soft edges (vertex alpha) ---------- */
const NR=22;
function mkCone(col){
  const n=1+(NR+1)*2,geo=keep(new THREE.BufferGeometry()),pos=new Float32Array(n*3),c=new Float32Array(n*4),idx=[];
  c[0]=c[1]=c[2]=1;c[3]=.6;
  for(let i=0;i<=NR;i++){const a=1+i*2,b=a+1;c[a*4]=c[a*4+1]=c[a*4+2]=1;c[a*4+3]=.42;c[b*4]=c[b*4+1]=c[b*4+2]=1;c[b*4+3]=0;
    if(i<NR){idx.push(0,a+2,a, a,a+2,b, b,a+2,b+2)}}
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(c,4));geo.setIndex(idx);
  const m=new THREE.Mesh(geo,keep(basic(col,{vertexColors:true,transparent:true,opacity:.55,depthWrite:false,side:THREE.DoubleSide})));
  m.frustumCulled=false;m.renderOrder=2;return m;
}
function setCone(m,x,y,a,fov,range){
  const p=m.geometry.attributes.position.array;p[0]=x;p[1]=.06;p[2]=y;
  for(let i=0;i<=NR;i++){const r=a-fov/2+fov*i/NR,d=ray(x,y,r,range,true),cx=Math.cos(r),cy=Math.sin(r),k=(1+i*2)*3;
    p[k]=x+cx*d*.72;p[k+1]=.06;p[k+2]=y+cy*d*.72;p[k+3]=x+cx*d;p[k+4]=.06;p[k+5]=y+cy*d}
  m.geometry.attributes.position.needsUpdate=true;
}

  S.sw=L.switches.map(s=>Object.assign({},s,{t:0}));
  S.shut=L.shutters.map(s=>({tiles:laserTiles(s),closed:false}));
  S.lockers=L.props.filter(p=>p.kind==='locker');
  S.p.a=Math.atan2(H/2-S.p.y,W/2-S.p.x);
  build();computeLight();
}

/* ---------- grid queries ---------- */
const walk=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&S.blk[x+y*W]===0;
function opaque(x,y,low){if(x<0||y<0||x>=W||y>=H)return true;const b=S.blk[x+y*W];return b===1||b===2||b===4||b===5||(low&&b===3)}
function inSmoke(x,y){for(const s of S.smokes)if(Math.hypot(x-s.x,y-s.y)<s.r)return true;return false}
function ray(x,y,a,max,smoke){const cx=Math.cos(a),cy=Math.sin(a);for(let d=0;d<max;d+=.1){const px=x+cx*d,py=y+cy*d;if(opaque(px|0,py|0,false)||(smoke&&inSmoke(px,py)))return d}return max}
function rayMove(x,y,a,max){const cx=Math.cos(a),cy=Math.sin(a);for(let d=0;d<max;d+=.1)if(!walk((x+cx*d)|0,(y+cy*d)|0))return d;return max}
function los(x1,y1,x2,y2,low){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/.15);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(opaque(x|0,y|0,low)||inSmoke(x,y))return false}return !inSmoke(x2,y2)}
function losW(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.ceil(d/.2);for(let i=1;i<n;i++){const x=x1+(x2-x1)*i/n,y=y1+(y2-y1)*i/n;if(opaque(x|0,y|0,false))return false}return true}
function bfs(sx,sy,tx,ty){
  if(!walk(tx,ty)||sx<0||sy<0||sx>=W||sy>=H)return[];
  const prev=new Int32Array(W*H).fill(-1),q=[sx+sy*W],goal=tx+ty*W;prev[q[0]]=q[0];
  for(let h=0;h<q.length;h++){const c=q[h];if(c===goal)break;const x=c%W,y=(c/W)|0;
    for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy,n=nx+ny*W;if(walk(nx,ny)&&prev[n]<0){prev[n]=c;q.push(n)}}}
  if(prev[goal]<0)return[];const out=[];let c=goal;while(c!==prev[c]){out.push([c%W,(c/W)|0]);c=prev[c]}return out.reverse()}
/* baked light: every lit lamp spreads over the tiles it can actually see */
function computeLight(){
  const A=S.light,R=4.8;A.fill(0);
  for(const l of S.lamps){if(!l.lit)continue;
    for(let y=Math.max(0,l.y-5);y<=Math.min(H-1,l.y+5);y++)for(let x=Math.max(0,l.x-5);x<=Math.min(W-1,l.x+5);x++){const i=x+y*W;if(S.blk[i]===1)continue;
      const d=Math.hypot(x-l.x,y-l.y);if(d>=R)continue;const v=1-d/R;if(v>A[i]&&losW(l.x+.5,l.y+.5,x+.5,y+.5))A[i]=v}}
  const px=S.limg.data;for(let i=0;i<W*H;i++){const v=Math.pow(A[i],.8)*255|0;px[i*4]=px[i*4+1]=px[i*4+2]=v;px[i*4+3]=255}
  S.lctx.putImageData(S.limg,0,0);S.ltex.needsUpdate=true;
}
function applyLamps(){for(const l of S.lamps)l.lit=l.on&&!S.sw.some(s=>s.t>0&&Math.hypot(s.x-l.x,s.y-l.y)<7.5);computeLight()}

/* ---------- fx helpers ---------- */
function ringFx(x,y,max,col,dur){let r=M.rings[0];for(const q of M.rings)if(q.t<=0){r=q;break}r.t=r.dur=dur;r.max=max;r.m.position.set(x,.07,y);setC(r.m.material.color,col);r.m.visible=true}
function toast(t,sec){$('toast').textContent=t;toastT=sec||3}
function icon(G,k){G.ik=k;G.it=0;if(k){G.icon.material=ICON[k];G.icon.visible=true}else G.icon.visible=false}
function shoot(x,y,a,sp,mine){let m=null;for(const q of M.bul)if(!q.visible){m=q;break}if(!m)return;m.visible=true;m.material=mine?MAT.dart:MAT.shot;m.rotation.y=-a;
  S.bullets.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:1.6,mine,m})}

/* ---------- guard AI ---------- */
const setPath=(G,x,y)=>{G.path=bfs(G.x|0,G.y|0,x|0,y|0)};
function turn(G,to,rate){G.a+=clamp(angDiff(to,G.a),-rate,rate)}
function follow(G,speed,dt){
  G.mv=false;if(!G.path.length)return true;
  const n=G.path[0];if(!walk(n[0],n[1])){G.path=[];return true}
  const dx=n[0]+.5-G.x,dy=n[1]+.5-G.y,d=Math.hypot(dx,dy),st=speed*dt;G.mv=true;
  if(d<=st){G.x=n[0]+.5;G.y=n[1]+.5;G.path.shift()}else{G.x+=dx/d*st;G.y+=dy/d*st;turn(G,Math.atan2(dy,dx),8*dt)}
  return !G.path.length}
function gSee(G){
  const p=S.p;if(S.demo||p.hidden)return 0;
  const T=G.T,range=T.range*(S.lit<DARK?.68:1)*(p.crouch?.88:1),dx=p.x-G.x,dy=p.y-G.y,d=Math.hypot(dx,dy);
  if(d>range||Math.abs(angDiff(Math.atan2(dy,dx),G.a))>T.fov/2)return 0;
  return los(G.x,G.y,p.x,p.y,p.crouch)?1.05-d/range:0}
function investigate(G,x,y,react,ic){
  if(G.st===ST.KO||G.st===ST.CHASE||G.st===ST.ALERT)return;
  if(G.st===ST.INV&&G.tg&&Math.hypot(G.tg.x-x,G.tg.y-y)<1.6){G.tg={x,y};setPath(G,x,y);return}
  G.st=ST.INV;G.tg={x,y};G.react=react;G.t=0;setPath(G,x,y);icon(G,ic||'q');G.sus=Math.max(G.sus,20)}
function hearAll(x,y,rad){for(const G of S.guards){if(G.st===ST.SUS&&G.seeing)continue;if(Math.hypot(G.x-x,G.y-y)<rad)investigate(G,x,y,.45)}}
function emitNoise(x,y,rad,vis){S.noiseV=Math.max(S.noiseV,Math.min(1,rad/8));if(vis)ringFx(x,y,rad*.45,0x9fe8ff,.55);if(!S.demo)hearAll(x,y,rad)}
function backToPatrol(G){G.st=ST.PATROL;G.wake=null;icon(G,'');setPath(G,G.wp[G.wi][0]+.5,G.wp[G.wi][1]+.5)}
function toSearch(G){G.st=ST.SEARCH;G.t=G.T.search;G.st2=0;G.path=[];icon(G,'q')}
function knock(G,sec,silent){G.st=ST.KO;G.t=sec;G.path=[];G.found=false;G.hp=G.T.hp;G.sus=0;G.seeing=false;icon(G,'z');S.kos++;sfx('ko');PT.burst(G.x,1,G.y,14,1.6,.6,.6,.8,1,3,1);emitNoise(G.x,G.y,silent?.9:2.4,false)}
function dartHit(G){PT.burst(G.x,.9,G.y,10,1.8,.4,.4,.95,1,2,.5);G.hp--;
  if(G.hp<=0)knock(G,S.stunDur);else{sfx('hit');G.hitT=.4;G.sus=Math.max(G.sus,65);G.lk={x:S.p.x,y:S.p.y};investigate(G,S.p.x,S.p.y,.3,'s');toast('الحارس ده محتاج طلقة تانية')}}
function fullAlarm(x,y,msg){
  S.radio={x,y};S.radioNew=true;S.alarmT=ALARM_T;if(S.alarm)return;
  S.alarm=true;S.alarmed=true;sfx('alarm');AU.siren(true);S.shake=.5;toast(msg||'إنذار كامل!',3);
  const busy=t=>(S.p.x|0)===t[0]&&(S.p.y|0)===t[1]||S.guards.some(G=>(G.x|0)===t[0]&&(G.y|0)===t[1]);
  for(const sh of S.shut)if(!sh.tiles.some(busy)){sh.closed=true;for(const t of sh.tiles)S.blk[t[0]+t[1]*W]=5;sfx('door')}}
function endAlarm(){S.alarm=false;S.radio=null;AU.siren(false);toast('الإنذار هدي، بس الحراس لسه بيدوّروا',3);
  for(const sh of S.shut)if(sh.closed){sh.closed=false;for(const t of sh.tiles)S.blk[t[0]+t[1]*W]=0}
  for(const G of S.guards){if(G.id%2)G.dirn=-G.dirn;if(G.st===ST.CHASE&&!G.seeing)toSearch(G)}}
function gUpdate(G,dt){
  const p=S.p,T=G.T;G.it+=dt;G.hitT-=dt;
  if(G.st===ST.KO){G.mv=false;G.t-=dt;if(G.t<=0){G.lk={x:G.x,y:G.y};toSearch(G);G.sus=40}return}
  const v=gSee(G);G.seeing=v>0;
  if(v){G.sus=Math.min(100,G.sus+(45+165*v)*(S.lit<DARK?.5:1)*(p.crouch?.7:1)*(S.running?1.4:1)*T.sense*dt);G.lk={x:p.x,y:p.y};G.lost=0}
  else{G.lost+=dt;if(G.st!==ST.CHASE&&G.st!==ST.ALERT)G.sus=Math.max(0,G.sus-16*dt)}
  const ap=Math.atan2(p.y-G.y,p.x-G.x),d=Math.hypot(p.x-G.x,p.y-G.y);
  if(G.st<=ST.PATROL||G.st===ST.SEARCH)for(const B of S.guards){   // a guard who sees a knocked-out colleague goes to wake him
    if(B.st!==ST.KO||B.found)continue;const bd=Math.hypot(B.x-G.x,B.y-G.y);
    if(bd<T.range*.8&&Math.abs(angDiff(Math.atan2(B.y-G.y,B.x-G.x),G.a))<T.fov/2&&los(G.x,G.y,B.x,B.y,false)){B.found=true;investigate(G,B.x,B.y,.5,'a');G.wake=B;G.sus=60;sfx('sus');break}}
  switch(G.st){
    case ST.IDLE:case ST.PATROL:
      if(v&&G.sus>10){G.st=ST.SUS;G.mv=false;icon(G,'s');sfx('sus');break}
      if(G.st===ST.IDLE){G.mv=false;G.t-=dt;if(G.t<=0){G.wi=(G.wi+G.dirn+G.wp.length)%G.wp.length;setPath(G,G.wp[G.wi][0]+.5,G.wp[G.wi][1]+.5);G.st=ST.PATROL}}
      else if(follow(G,T.speed,dt)){G.st=ST.IDLE;G.t=.9+(G.id%3)*.35}
      break;
    case ST.SUS:G.mv=false;
      if(v){turn(G,ap,6*dt);if(G.sus>=100){G.st=ST.ALERT;G.t=.55;icon(G,'a');sfx('alert');
        for(const O of S.guards)if(O!==G&&Math.hypot(O.x-G.x,O.y-G.y)<8)investigate(O,G.lk.x,G.lk.y,.3,'a')}}
      else if(G.lost>1.1)investigate(G,G.lk.x,G.lk.y,0);
      break;
    case ST.INV:
      if(v&&G.sus>25){G.st=ST.SUS;icon(G,'s');break}
      if(G.react>0){G.mv=false;G.react-=dt;turn(G,Math.atan2(G.tg.y-G.y,G.tg.x-G.x),7*dt);break}
      if(follow(G,T.speed*1.35,dt)){G.t+=dt;G.a+=1.9*dt;if(G.wake&&G.wake.st===ST.KO){G.wake.t=Math.min(G.wake.t,.8);G.wake=null}if(G.t>T.inv)backToPatrol(G)}
      break;
    case ST.ALERT:G.mv=false;turn(G,G.lk?Math.atan2(G.lk.y-G.y,G.lk.x-G.x):ap,9*dt);G.t-=dt;
      if(G.t<=0){G.st=ST.CHASE;G.chaseT=0;G.rp=0;G.fire=.5;icon(G,'c')}
      break;
    case ST.CHASE:{
      G.chaseT+=dt;G.rp-=dt;G.fire-=dt;let arrived=false;
      if(v&&d<3){G.mv=false;turn(G,ap,9*dt)}
      else{if(G.rp<=0){G.rp=.35;setPath(G,G.lk.x,G.lk.y)}arrived=follow(G,T.chase,dt)}
      if(v){if(G.fire<=0&&d<8.5&&Math.abs(angDiff(ap,G.a))<.5){G.fire=T.fire;shoot(G.x+Math.cos(ap)*.3,G.y+Math.sin(ap)*.3,ap+(Math.random()-.5)*.14,8.5,false);sfx('shot');PT.burst(G.x+Math.cos(ap)*.4,1,G.y+Math.sin(ap)*.4,5,1.5,.15,1,.7,.3,0,0)}
        if(S.alarm){S.radio={x:p.x,y:p.y};S.radioNew=true;S.alarmT=ALARM_T}else if(G.chaseT>3.5)fullAlarm(p.x,p.y,'حارس بلّغ بالراديو: إنذار كامل!')}
      else if(arrived||G.lost>T.memory)toSearch(G);
      break}
    case ST.SEARCH:
      if(v&&G.sus>30){G.st=ST.ALERT;G.t=.3;icon(G,'a');sfx('alert');break}
      G.t-=dt;
      if(follow(G,T.speed*1.3,dt)){G.a+=2.2*dt;G.st2-=dt;
        if(G.st2<=0){G.st2=1.3;for(let k=0;k<6;k++){const x=(G.lk.x+(Math.random()-.5)*8)|0,y=(G.lk.y+(Math.random()-.5)*8)|0;if(walk(x,y)){setPath(G,x+.5,y+.5);if(G.path.length&&G.path.length<14)break;G.path=[]}}}}
      if(G.t<=0)backToPatrol(G);
      break;
  }
  if(d<.55&&!S.demo&&!p.hidden&&los(G.x,G.y,p.x,p.y,false)){     // body contact
    if(G.st===ST.CHASE||G.st===ST.ALERT)hurt();
    else if(Math.abs(angDiff(ap,G.a))<1.75||G.st===ST.SUS){G.sus=100;G.lk={x:p.x,y:p.y};G.st=ST.ALERT;G.t=.35;icon(G,'a');sfx('alert')}}
}

/* ---------- player ---------- */
function moveInput(){
  let mx=0,my=0;
  if(keys.has('ArrowLeft')||keys.has('KeyA'))mx--;if(keys.has('ArrowRight')||keys.has('KeyD'))mx++;
  if(keys.has('ArrowUp')||keys.has('KeyW'))my--;if(keys.has('ArrowDown')||keys.has('KeyS'))my++;
  let m=Math.hypot(mx,my);if(m>0)return[mx/m,my/m,1];
  if(joy){m=Math.hypot(joy.x,joy.y);if(m>.15)return[joy.x,joy.y,m]}return[0,0,0]}
function openDoor(tx,ty){const D=S.doors[tx+','+ty];S.blk[tx+ty*W]=0;if(D&&!D.open){D.open=.01;sfx('door');toast('اتفتحت الخزنة');PT.burst(tx+.5,.8,ty+.5,16,2,.5,1,.8,.3,3,.5)}}
function blocked(x,y){const r=.28;
  for(const[ox,oy]of[[-r,-r],[r,-r],[-r,r],[r,r]]){const tx=(x+ox)|0,ty=(y+oy)|0;if(tx<0||ty<0||tx>=W||ty>=H)return true;const b=S.blk[tx+ty*W];
    if(b===4){if(S.key&&S.key.got)openDoor(tx,ty);else{toast('الباب مقفول. دوّر على المفتاح');return true}}else if(b)return true}
  return false}
function hurt(){
  if(S.hurtCd>0||S.mode!=='play')return;S.hp--;S.dmg++;S.hurtCd=.85;S.p.hitT=.3;S.shake=.4;sfx('hurt');PT.burst(S.p.x,.9,S.p.y,12,2,.4,1,.2,.25,4,.5);
  if(S.hp<=0)endLevel(false)}
function endLevel(win){if(S.mode!=='play')return;S.mode=win?'win':'lose';S.modeT=0;AU.siren(false);keys.clear();joy=null;$('joy').hidden=true;$('prompt').hidden=true;sfx(win?'win':'lose');
  if(win)PT.burst(S.p.x,1,S.p.y,40,3,1.2,.4,1,.7,2,2)}
function ctxFind(){
  const p=S.p;if(p.hidden)return{type:'unhide',label:'اخرج من الدولاب'};
  let best=null,bd=1.3;
  for(const G of S.guards){if(G.st===ST.KO||G.st===ST.CHASE||G.st===ST.ALERT)continue;const d=Math.hypot(p.x-G.x,p.y-G.y);
    if(d<bd&&Math.abs(angDiff(Math.atan2(p.y-G.y,p.x-G.x),G.a))>1.75&&los(G.x,G.y,p.x,p.y,false)){bd=d;best=G}}
  if(best)return{type:'takedown',label:'ضربة صامتة',G:best};
  for(const l of S.lockers){const dx=Math.abs(l.x+.5-p.x),dy=Math.abs(l.y+.5-p.y);if(dx<1.15&&dy<1.15&&(dx<.6||dy<.6))return{type:'hide',label:'استخبى في الدولاب',l}}
  for(const s of S.sw)if(Math.hypot(s.x+.5-p.x,s.y+.5-p.y)<.95)return{type:'switch',label:s.t>0?'شغّل النور':'اطفي النور',s};
  return null}
function doAct(){
  const c=S.ctx,p=S.p;if(!c||S.mode!=='play'||p.act)return;
  if(c.type==='takedown'){p.act={type:'takedown',t:.5,G:c.G,done:false};p.crouch=false}
  else if(c.type==='hide'){if(S.seen){toast('شايفينك! مش هينفع تستخبى دلوقتي');return}p.hidden=c.l;sfx('hide');toast('مستخبي. اضغط تاني أو اتحرك عشان تخرج',2.5)}
  else if(c.type==='unhide'){p.hidden=null;sfx('hide')}
  else if(c.type==='switch'){const s=c.s;s.t=s.t>0?0:14;applyLamps();sfx('sw');emitNoise(s.x+.5,s.y+.5,6,true);PT.burst(s.x+.5+s.dx*.3,1,s.y+.5+s.dy*.3,8,1.5,.3,1,.9,.4,3,.5);if(s.t>0)toast('النور اتطفى ١٤ ثانية. الحراس هييجوا يشوفوا السبب',3)}}
function useTool(k){
  if(!S||S.mode!=='play'||S.tools[k]<=0||S.p.act||S.p.hidden)return;const p=S.p;S.tools[k]--;
  if(k==='smoke'){const grp=new THREE.Group(),mat=keep(std(0xc4cbe0,{transparent:true,opacity:.5,depthWrite:false,roughness:1}));
    for(let i=0;i<8;i++){const a=i*.8,r=i?.75:0;mk(grp,GEO.sph,mat,.75+(i%2)*.3,.75+(i%2)*.3,.75+(i%2)*.3,Math.cos(a)*r,.5+(i%3)*.3,Math.sin(a)*r,false)}
    grp.position.set(p.x,0,p.y);grp.scale.setScalar(.2);world.add(grp);S.smokes.push({x:p.x,y:p.y,t:S.smokeDur,r:.3,max:1.75,grp,mat});sfx('smoke');PT.burst(p.x,.4,p.y,24,2.5,.9,.5,.52,.6,0,.6)}
  else if(k==='emp'){S.emp=S.empDur;sfx('emp');S.shake=.25;ringFx(p.x,p.y,9,0x63e6ff,.8);toast('الكاميرات والليزر متعطلة');
    for(const c of S.cams)PT.burst(c.x,1.5,c.y,10,2,.6,.4,.9,1,4,1);for(const l of S.lasers)PT.burst(l.x+(l.dir==='h'?l.len/2:.5),.6,l.y+(l.dir==='h'?.5:l.len/2),8,2,.5,.4,.9,1,4,1)}
  else if(k==='coin'){const d=Math.max(.3,rayMove(p.x,p.y,p.a,5)-.35);S.coin={x0:p.x,y0:p.y,x1:p.x+Math.cos(p.a)*d,y1:p.y+Math.sin(p.a)*d,t:0};M.coin.visible=true;p.shootT=.25}
  else{let a=p.a,best=9;
    for(const G of S.guards){if(G.st===ST.KO)continue;const d=Math.hypot(G.x-p.x,G.y-p.y),ag=Math.atan2(G.y-p.y,G.x-p.x);if(d<best&&Math.abs(angDiff(ag,p.a))<.55&&los(p.x,p.y,G.x,G.y,false)){best=d;a=ag}}
    p.a=a;p.shootT=.38;p.crouch=false;const mx=p.x+Math.cos(a)*.45,my=p.y+Math.sin(a)*.45;shoot(mx,my,a,16,true);sfx('dart');S.shake=Math.max(S.shake,.12);
    M.flash.position.set(mx,1,my);M.flash.intensity=2.2;PT.burst(mx,1,my,6,1.6,.15,.5,.95,1,0,0);emitNoise(p.x,p.y,4,true)}
}
function playerUpdate(dt){
  const p=S.p;p.shootT-=dt;p.hitT-=dt;p.pickT-=dt;
  if(p.act){const A=p.act,G=A.G;A.t-=dt;S.moving=false;p.a+=clamp(angDiff(Math.atan2(G.y-p.y,G.x-p.x),p.a),-12*dt,12*dt);
    if(!A.done&&A.t<.24){A.done=true;if(G.st!==ST.KO){knock(G,12,true);sfx('hit');toast('ضربة صامتة',1.5)}}
    if(A.t<=0)p.act=null;return}
  const[mx,my,m]=moveInput();
  if(p.hidden){S.moving=false;if(m>0)p.hidden=null;else return}
  S.running=m>0&&!p.crouch&&(runToggle||keys.has('ShiftLeft')||keys.has('ShiftRight'));S.moving=m>0;
  if(m>0){const sp=(p.crouch?1.75:S.running?5:3.2)*S.speedK*dt*Math.min(1,m*1.2);
    if(!blocked(p.x+mx*sp,p.y))p.x+=mx*sp;if(!blocked(p.x,p.y+my*sp))p.y+=my*sp;
    p.a+=clamp(angDiff(Math.atan2(my,mx),p.a),-14*dt,14*dt);
    if(!p.crouch){S.stepT-=dt;if(S.stepT<=0){if(S.running){S.stepT=.27;emitNoise(p.x,p.y,4.2,true);sfx('run');PT.burst(p.x,.05,p.y,3,.6,.5,.35,.36,.42,0,.2)}else{S.stepT=.42;emitNoise(p.x,p.y,1.3,false);sfx('step')}}}}

/* ---------- main update ---------- */
function laserHit(l){const p=S.p,c=l.o+.5;return l.dir==='h'?Math.abs(p.y-(l.y+c))<.27&&p.x>l.x-.2&&p.x<l.x+l.len+.2:Math.abs(p.x-(l.x+c))<.27&&p.y>l.y-.2&&p.y<l.y+l.len+.2}
function laserOn(l){return S.emp<=0&&(l.kind==='move'||((S.time+l.ph)%(l.on+l.off))<l.on)}
function ambient(dt){     // things that also run behind the menu
  for(const l of S.lamps)if(l.flick){l.ft-=dt;if(l.ft<=0){l.dim=Math.random()<.3?.12:1;l.ft=l.dim<1?.04+Math.random()*.12:.4+Math.random()*2.6;if(l.dim<1&&l.lit&&Math.random()<.4)PT.burst(l.x+.5,1.65,l.y+.5,3,1.2,.35,1,.85,.4,5,0)}}
  for(const c of S.cams){c.t+=dt;c.cur=c.base+Math.sin(c.t*.7)*c.sweep}
  for(const l of S.lasers)if(l.kind==='move')l.o=l.travel*(.5-.5*Math.cos(S.time*l.speed*Math.PI/Math.max(1,l.travel)));
  for(const G of S.guards)gUpdate(G,dt);
}
function update(dt){
  S.time+=dt;const p=S.p;
  for(const s of S.smokes){s.t-=dt;s.r=Math.min(s.max,s.r+3*dt)}
  for(let i=S.smokes.length-1;i>=0;i--)if(S.smokes[i].t<=0){world.remove(S.smokes[i].grp);S.smokes.splice(i,1)}
  if(S.emp>0)S.emp-=dt;if(S.hurtCd>0)S.hurtCd-=dt;S.laserCd-=dt;S.noiseV=Math.max(0,S.noiseV-dt*1.6);
  for(const s of S.sw)if(s.t>0){s.t-=dt;if(s.t<=0){s.t=0;applyLamps()}}
  ambient(dt);
  if(S.alarm&&S.radioNew){S.radioNew=false;for(const G of S.guards){if(G.st===ST.KO||G.seeing)continue;G.lk={x:S.radio.x,y:S.radio.y};G.lost=0;if(G.st!==ST.CHASE&&G.st!==ST.ALERT){G.st=ST.CHASE;G.chaseT=0;G.fire=.7;G.rp=0;icon(G,'c')}}}
  playerUpdate(dt);if(S.mode!=='play')return;
  // cameras
  let seen=false,det=0,lvl=0;
  for(const c of S.cams){c.seeing=false;
    if(S.emp<=0&&!p.hidden){const dx=p.x-c.x,dy=p.y-c.y,d=Math.hypot(dx,dy);c.seeing=d<c.range&&Math.abs(angDiff(Math.atan2(dy,dx),c.cur))<.375&&los(c.x,c.y,p.x,p.y,p.crouch)}
    if(c.seeing){c.sus=Math.min(100,c.sus+75*(S.lit<DARK?.55:1)*dt);seen=true;c.beep-=dt;if(c.beep<=0){c.beep=.35;sfx('cam')}if(c.sus>=100)fullAlarm(p.x,p.y,'الكاميرا كشفتك: إنذار كامل!')}
    else c.sus=Math.max(0,c.sus-25*dt);
    det=Math.max(det,c.sus/100)}
  for(const G of S.guards){if(G.st===ST.KO)continue;if(G.seeing)seen=true;det=Math.max(det,G.sus/100);
    if(G.st>=ST.ALERT&&G.st<=ST.SEARCH)lvl=2;else if((G.st===ST.SUS||G.st===ST.INV)&&lvl<1)lvl=1}
  S.seen=seen;S.det=det;S.level=S.alarm?3:lvl||(det>.12?1:0);
  // projectiles
  for(const b of S.bullets){b.t-=dt;
    for(let k=0;k<3&&b.t>0;k++){b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;      // sub-steps so a fast dart cannot skip over a guard
      if(opaque(b.x|0,b.y|0,false)){b.t=0;PT.burst(b.x,.8,b.y,4,1.5,.2,1,.8,.4,3,.3)}
      else if(b.mine){for(const G of S.guards)if(G.st!==ST.KO&&Math.hypot(G.x-b.x,G.y-b.y)<.45){dartHit(G);b.t=0;break}}
      else if(!p.hidden&&Math.hypot(p.x-b.x,p.y-b.y)<.35){b.t=0;hurt();if(S.mode!=='play')return}}}
  for(let i=S.bullets.length-1;i>=0;i--)if(S.bullets[i].t<=0){S.bullets[i].m.visible=false;S.bullets.splice(i,1)}
  if(S.coin){const c=S.coin;c.t+=dt*1.9;if(c.t>=1){sfx('coin');emitNoise(c.x1,c.y1,S.coinRad,true);PT.burst(c.x1,.1,c.y1,8,1.4,.4,1,.8,.3,3,1);M.coin.visible=false;S.coin=null}}
  // pickups
  const near=o=>o&&!o.got&&Math.hypot(o.x-p.x,o.y-p.y)<.62;
  for(const g of S.gems)if(near(g)){g.got=true;S.score+=100;sfx('gem');PT.burst(g.x,.6,g.y,16,2,.6,.4,.9,1,2,1);popHud('hGems')}
  if(near(S.key)){S.key.got=true;sfx('key');toast('معاك المفتاح. روح على باب الخزنة');PT.burst(p.x,.7,p.y,12,1.8,.5,1,.8,.3,2,1)}
  for(const f of S.fakes)if(near(f)){f.got=true;p.pickT=.4;PT.burst(f.x,.8,f.y,20,2.5,.6,1,.3,.3,2,1);fullAlarm(p.x,p.y,'جوهرة مزيفة! اشتغل الإنذار')}
  if(near(S.loot)){S.loot.got=true;S.score+=500;p.pickT=.55;sfx('jewel');PT.burst(S.loot.x,.9,S.loot.y,46,3,1,1,.8,.35,2,1.5);const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on');toast('الجوهرة معاك! ارجع للمخرج الأخضر',3.5);popHud('hScore')}
  if(S.loot.got&&Math.hypot(S.exit.x-p.x,S.exit.y-p.y)<.62)return endLevel(true);
  // lasers
  if(!p.hidden)for(const l of S.lasers)if(S.laserCd<=0&&laserOn(l)&&laserHit(l)){S.laserCd=1.5;sfx('laser');fullAlarm(p.x,p.y,'لمست الليزر: إنذار كامل!');PT.burst(p.x,.6,p.y,14,2,.4,1,.3,.35,2,.5)}
  if(S.alarm){if(!seen)S.alarmT-=dt;if(S.alarmT<=0)endAlarm()}
  if(det>.5||S.hp===1||S.alarm){S.heartT-=dt;if(S.heartT<=0){S.heartT=S.alarm?.55:.85;sfx('heart')}}
  S.ctx=ctxFind();
}

function mainMenu(){
  load(0,true);for(const id of['hud','pad','intro','prompt','joy'])$(id).hidden=true;$('toast').textContent='';AU.siren(false);menuHome()}
function menuHome(){
  const done=SV.stars.filter(s=>s>0).length,f=SV.stars.findIndex(s=>!s),next=f<0?LEVELS.length-1:f,tot=SV.stars.reduce((a,b)=>a+b,0);
  scr(`<div class="card"><h1 class="logo">SILENT <span>ROB</span></h1><p class="tag">ادخل في الظل. اسرق الجوهرة. اخرج قبل ما حد يحس.</p><div class="menu">
    <button class="go" type="button" data-act="lv" data-i="${next}">${done?'العب · المرحلة '+(next+1):'ابدأ اللعب'}</button>
    ${done?`<button type="button" data-act="lv" data-i="${SV.last}">كمّل · ${LEVELS[SV.last].name}</button>`:''}
    <button type="button" data-act="levels">اختيار المرحلة</button><button type="button" data-act="shop">الترقيات</button>
    <button type="button" data-act="how">طريقة اللعب</button><button type="button" data-act="settings">الإعدادات</button></div>
    <p class="tag"><span class="money">$${SV.money}</span> · ${tot}/${LEVELS.length*3} ★ · ${done}/${LEVELS.length} مرحلة</p></div>`)}
function menuLevels(){
  scr(`<div class="card wide"><h2 class="h">اختيار المرحلة</h2><div class="levels">${LEVELS.map((L,i)=>{const o=unlocked(i);
    return `<button type="button" data-act="lv" data-i="${i}" ${o?'':'disabled'}><span class="nm">${i+1} · ${L.name}</span><span class="ds">${o?(SV.best[i]?'أفضل وقت '+fmt(SV.best[i])+' · '+SV.score[i]:'لسه ما اتلعبتش'):'مقفولة'}</span><span class="st">${starStr(SV.stars[i])}</span></button>`}).join('')}</div>
    <div class="row"><button type="button" data-act="home">رجوع</button></div></div>`,true)}
function menuShop(){
  scr(`<div class="card"><h2 class="h">الترقيات <span class="money">$${SV.money}</span></h2><p class="tag">الفلوس بتيجي من نقاط المراحل: الجواهر، التسلل الكامل، السرعة، وعدم الإصابة.</p><div class="shop">${Object.keys(UPG).map(k=>{const lv=SV.up[k],c=UP_COST[lv];
    return `<div class="it"><b>${UPG[k].n} <span class="lv">${'▮'.repeat(lv)+'▯'.repeat(3-lv)}</span></b><small>${UPG[k].d}</small><button type="button" data-act="buy" data-k="${k}" ${lv>=3||SV.money<c?'disabled':''}>${lv>=3?'أقصى مستوى':'$'+c}</button></div>`}).join('')}</div>
    <div class="row"><button type="button" data-act="home">رجوع</button></div></div>`,true)}
function menuHow(){
  scr(`<div class="card"><h2 class="h">طريقة اللعب</h2><div class="how">
    <span><b>الهدف:</b> اسرق الجوهرة الذهبية وارجع للدايرة الخضرا. بعض الخزن محتاجة مفتاح.</span>
    <span><b>الحركة:</b> WASD أو الأسهم. <b>Shift</b> جري (صوته عالي). <b>C</b> تسلل صامت وبتستخبى ورا الأثاث الواطي.</span>
    <span><b>الظل:</b> اللمبات المطفية بتعمل مناطق ضلمة، وفيها الحراس بيشوفوك من مسافة أقصر وأبطأ.</span>
    <span><b>التفاعل (E):</b> ضربة صامتة من ضهر الحارس، استخبى في دولاب، أو اطفي النور من علبة الكهربا.</span>
    <span><b>الأدوات:</b> <b>Space</b> طلقة مخدّرة · <b>1</b> دخان · <b>2</b> تعطيل الكاميرات والليزر · <b>3</b> عملة تشد الحراس.</span>
    <span><b>الحراس:</b> ؟ سمع صوت · ! شاكك · !! شافك · ! أحمر بيطاردك. بيدوّروا في آخر مكان شافوك فيه، مش عارفين مكانك.</span>
    <span><b>الإنذار:</b> ليزر أو كاميرا أو حارس يبلّغ بالراديو. بيهدى بعد ١٢ ثانية من غير ما حد يشوفك.</span>
    <span><b>الموبايل:</b> اسحب بإصبعك في أي مكان للحركة، والأزرار على اليمين.</span></div>
    <div class="row"><button type="button" data-act="home">رجوع</button></div></div>`,true)}
function menuSettings(ask){
  const q=(v,l)=>`<button type="button" data-act="q" data-v="${v}" aria-pressed="${SV.q===v}">${l}</button>`;
  scr(`<div class="card"><h2 class="h">الإعدادات</h2>
    <div class="field"><span>جودة الرسم <small class="tag">(الحالية: ${QS[Q].n})</small></span><div class="seg">${q('auto','تلقائي')+q('low','منخفضة')+q('med','متوسطة')+q('high','عالية')}</div></div>
    <div class="field"><span>الصوت</span><button type="button" data-act="snd" aria-pressed="${SV.snd}">${SV.snd?'شغّال':'مقفول'}</button></div>
    <div class="field"><span>مسح كل التقدم</span><button type="button" data-act="${ask?'reset2':'reset'}">${ask?'متأكد؟ اضغط تاني للمسح':'مسح'}</button></div>
    <div class="row"><button type="button" data-act="home">رجوع</button></div></div>`,true)}
function pause(){if(S.mode!=='play')return;S.mode='pause';AU.siren(false);keys.clear();joy=null;$('joy').hidden=true;
  scr(`<div class="card"><h2 class="h en">PAUSED</h2><div class="row"><button class="go" type="button" data-act="resume">كمّل</button><button type="button" data-act="retry">إعادة المرحلة</button><button type="button" data-act="menu">القائمة الرئيسية</button></div></div>`,true)}
function showResult(){
  const win=S.mode==='win';$('hud').hidden=true;$('pad').hidden=true;$('prompt').hidden=true;
  if(!win){scr(`<div class="card"><h2 class="h en" style="color:var(--red)">MISSION FAILED</h2><p class="tag" style="text-align:center">الحراس وقّعوك. جرّب تمشي في الظل، واستخدم الدخان عشان تقطع عليهم الرؤية.</p>
    <div class="row"><button class="go" type="button" data-act="retry">حاول تاني</button><button type="button" data-act="menu">القائمة</button></div></div>`,true);return}
  const gems=S.gems.filter(g=>g.got).length,allG=gems===S.gems.length,n=1+(allG?1:0)+(S.alarmed?0:1),tb=Math.max(0,Math.round((S.L.par-S.time)*5));
  const bonus=(S.alarmed?0:400)+(S.dmg?0:200)+(S.kos?0:150)+tb,total=S.score+bonus,money=Math.round(total/10),first=SV.stars[S.i]===0;
  SV.stars[S.i]=Math.max(SV.stars[S.i],n);SV.best[S.i]=SV.best[S.i]?Math.min(SV.best[S.i],S.time):S.time;SV.score[S.i]=Math.max(SV.score[S.i],total);SV.money+=money;save();
  const unl=first&&S.i===0?'أداة جديدة اتفتحت: قنبلة الدخان':first&&S.i===1?'أداة جديدة اتفتحت: جهاز التعطيل':'';
  const r=(l,v,c)=>`<span>${l}</span><b class="${c||''}">${v}</b>`;
  scr(`<div class="card"><h2 class="h en">MISSION COMPLETE</h2><div class="stars">${[0,1,2].map(i=>`<i>${i<n?'★':'☆'}</i>`).join('')}</div>
    <div class="rows">${r('الوقت',fmt(S.time))+r('الجواهر',gems+'/'+S.gems.length,allG?'ok':'')+r('الإنذار',S.alarmed?'اشتغل':'ما اشتغلش',S.alarmed?'bad':'ok')+r('الضرر',S.dmg,S.dmg?'bad':'ok')+r('حراس نيّمتهم',S.kos)
      +r('الجوهرة والجواهر','+'+S.score)+(S.alarmed?'':r('تسلل كامل','+400','ok'))+(S.dmg?'':r('من غير إصابة','+200','ok'))+(S.kos?'':r('شبح: ولا حارس اتلمس','+150','ok'))+(tb?r('مكافأة السرعة','+'+tb,'ok'):'')
      +r('المجموع',total,'tot')+r('الفلوس','+$'+money,'tot')}</div>
    ${unl?`<p class="tag" style="text-align:center;color:var(--cyan)">${unl}</p>`:''}
    <div class="row">${S.i<LEVELS.length-1?'<button class="go" type="button" data-act="next">NEXT LEVEL</button>':''}<button type="button" data-act="retry">إعادة</button><button type="button" data-act="shop">الترقيات</button><button type="button" data-act="menu">القائمة</button></div></div>`,true);
}
function startLevel(i){
  AU.init();if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();sfx('ui');const f=$('fade');f.classList.add('on');
  setTimeout(()=>{hideScr();load(i);SV.last=i;save();hudC='';runToggle=false;$('bRun').setAttribute('aria-pressed',false);
    $('inNum').textContent='MISSION '+String(i+1).padStart(2,'0')+' / '+LEVELS.length;$('inName').textContent=LEVELS[i].name;$('inBrief').textContent=LEVELS[i].brief;
    for(const id of['hud','pad','prompt','joy'])$(id).hidden=true;$('toast').textContent='';$('intro').hidden=false;f.classList.remove('on')},340)}
function beginPlay(){if(S.mode!=='intro')return;S.mode='play';$('intro').hidden=true;$('hud').hidden=false;$('pad').hidden=false;
  if(S.i===0)toast('امشي في الظل وراقب بقعة ضوء الحارس. اضغط C للتسلل',5);else if(S.i===1)toast('معاك دخان دلوقتي: بيحجب رؤية الحراس والكاميرات',5);else if(S.i===2)toast('معاك جهاز التعطيل: بيوقف الليزر والكاميرات',5)}

/* ---------- input ---------- */
function bindInput(){
  $('screen').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;AU.init();
    if(a==='lv')return startLevel(+b.dataset.i);if(a==='next')return startLevel(S.i+1);if(a==='retry')return startLevel(S.i);
    sfx('ui');
    if(a==='levels')menuLevels();else if(a==='shop')menuShop();else if(a==='how')menuHow();else if(a==='settings')menuSettings();
    else if(a==='home'){if(S.demo)menuHome();else mainMenu()}else if(a==='menu')mainMenu();
    else if(a==='resume'){S.mode='play';hideScr();if(S.alarm)AU.siren(true)}
    else if(a==='buy'){const k=b.dataset.k,c=UP_COST[SV.up[k]];if(SV.up[k]<3&&SV.money>=c){SV.money-=c;SV.up[k]++;save();sfx('buy')}menuShop()}
    else if(a==='q'){SV.q=b.dataset.v;qCap=2;save();applyQ();menuSettings()}
    else if(a==='snd'){SV.snd=!SV.snd;save();if(!SV.snd)AU.siren(false);menuSettings()}
    else if(a==='reset')menuSettings(true);
    else if(a==='reset2'){SV.stars=[];SV.best=[];SV.score=[];SV.money=0;SV.last=0;SV.up={speed:0,smoke:0,dart:0,emp:0,noise:0};loadSaveDefaults();save();menuSettings()}});
  $('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.blur();const id=b.id;
    if(b.dataset.tool)useTool(b.dataset.tool);else if(id==='bFire')useTool('dart');else if(id==='bAct')doAct();
    else if(id==='bCrouch'){if(S.mode==='play')S.p.crouch=!S.p.crouch}else if(id==='bRun'){runToggle=!runToggle;b.setAttribute('aria-pressed',runToggle)}});
  $('bPause').addEventListener('click',e=>{e.currentTarget.blur();pause()});
  addEventListener('keydown',e=>{
    if(S.mode==='intro'){beginPlay();return}
    if(e.code==='Escape'||e.code==='KeyP'){if(S.mode==='play')pause();else if(S.mode==='pause'){S.mode='play';hideScr();if(S.alarm)AU.siren(true)}return}
    if(S.mode!=='play')return;
    if(/^Arrow/.test(e.code)||e.code==='Space')e.preventDefault();keys.add(e.code);if(e.repeat)return;
    switch(e.code){case'Space':useTool('dart');break;case'Digit1':useTool('smoke');break;case'Digit2':useTool('emp');break;case'Digit3':useTool('coin');break;
      case'KeyE':case'KeyF':case'Enter':doAct();break;case'KeyC':S.p.crouch=!S.p.crouch;break;case'KeyR':startLevel(S.i);break}});
  addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space'&&S.mode==='play')e.preventDefault()});
  addEventListener('blur',()=>keys.clear());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
  const jEl=$('joy'),knob=$('knob');
  cv.addEventListener('pointerdown',e=>{if(S.mode==='intro'){beginPlay();return}if(S.mode!=='play')return;const r=cv.getBoundingClientRect();joy={id:e.pointerId,ox:e.clientX-r.left,oy:e.clientY-r.top,x:0,y:0};
    jEl.style.left=joy.ox+'px';jEl.style.top=joy.oy+'px';knob.style.transform='';jEl.hidden=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!joy||joy.id!==e.pointerId)return;const r=cv.getBoundingClientRect(),dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy,m=Math.max(42,Math.hypot(dx,dy));joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`});
  const endJoy=e=>{if(joy&&joy.id===e.pointerId){joy=null;jEl.hidden=true}};
  cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  addEventListener('resize',resize);
}
function loadSaveDefaults(){for(let i=0;i<LEVELS.length;i++){SV.stars[i]=0;SV.best[i]=0;SV.score[i]=0}}

/* ---------- main loop ---------- */
let lastT=0,fAcc=0,fN=0;
function frame(t){
  requestAnimationFrame(frame);const raw=(t-lastT)/1000||0;lastT=t;const dt=Math.min(.05,raw);S.clock+=dt;
  if(S.mode==='play'){update(dt);if(S.mode==='play')hud()}
  else if(S.mode==='demo'){S.time+=dt;ambient(dt)}
  else if(S.mode==='intro'){S.modeT+=dt;if(S.modeT>3.2)beginPlay()}
  else if(S.mode==='win'||S.mode==='lose'){S.modeT+=dt;if(S.modeT>1.7&&!S.shown){S.shown=true;showResult()}}
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').textContent=''}
  fxDom();PT.update(dt);sync(dt);renderer.render(scene,cam);
  if(SV.q==='auto'&&S.mode==='play'&&raw>0&&raw<.5){fAcc+=raw;fN++;if(fAcc>4){const fps=fN/fAcc;fAcc=fN=0;if(fps<26&&Q>0){qCap=Q-1;applyQ()}}}   // auto quality: step down when the device struggles
}
loadSave();
if(!renderer||!LEVELS.length){scr('<div class="card"><h2 class="h">اللعبة محتاجة WebGL</h2><p class="tag">المتصفح ده مش قادر يشغّل الرسم ثلاثي الأبعاد. جرّب متصفح تاني أو فعّل تسريع الجرافيك.</p></div>',true)}
else{bindInput();applyQ();mainMenu();requestAnimationFrame(frame);window.SR={get S(){return S},LEVELS,startLevel,beginPlay,ST}}
</script>
</body>
</html>
